# Dev profile properties (reads secrets from environment variables when provided)

# Activate profile
spring.profiles.active=dev

# Server
server.port=8082

# Datasource (override via environment variables on the host/render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cafemgmt?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mail (override via env vars on host)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}

# JWT - bind from environment for security
jwt.secret=${JWT_SECRET:defaultDevSecret}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.issuer=cafe_online_dev

# Swagger UI - if you put a static openapi.yaml under resources/static
springdoc.swagger-ui.url=/openapi.yaml
